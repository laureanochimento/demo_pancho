<style>
/* Layout: backoffice con menú lateral en escritorio; en el celular, app con barra superior y navegación inferior. Identidad Mostaza: negro, lime como única acción, bordes rectos. */
:root{

  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}

button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:0;height:44px;padding:0 12px;color:var(--fg);min-width:0}
input:focus,select:focus{border-color:var(--lime);outline:none}
input[type=checkbox],input[type=radio]{height:18px;width:18px;accent-color:var(--lime);padding:0;flex:none}
.num{font-variant-numeric:tabular-nums}
.eb{font-family:var(--f-label);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3)}

.app{display:flex;min-height:100%}
.side{width:236px;flex:none;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:22px 12px 24px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.02em}

function controles(c){

  var n=neto(c); if(c.netoDecl){res.diff=c.netoDecl-n; res.sumaOk=Math.abs(res.diff)<1;}
  D.comp.forEach(function(o){ if(o.id!==c.id&&o.prov===c.prov&&o.num===c.num&&/\d/.test(c.num)&&o.estado!=='duplicada')res.dup=true; });
  c.ren.forEach(function(r){
    if(r.estado==='gasto')return;
    if(!r.ins) res.sinIns++;

    if(r.ins&&r.pres){ var u=ultimaCompra(c.loc,r.ins,null,c.prov,c.id)||ultimaCompra(c.loc,r.ins,null,null,c.id);
      if(u){ var b=r.precio/presDe(D,r.ins,r.pres).f, dv=(b-u.base)/u.base;

  });

function sugerir(desc,cat){
  var d=norm(desc), toks=d.split(/[^A-Z0-9]+/).filter(function(t){return t.length>2;});
  var num=(d.match(/(\d+[.,]?\d*)\s*(ML|CC|L|LT|KG|GR|G)?/)||[]);
  return insCompra(cat).map(function(i){
    var nm=norm(i.nombre), s=0; nm.split(' ').forEach(function(w){ if(w.length>2&&toks.some(function(t){return t.indexOf(w.slice(0,5))===0||w.indexOf(t.slice(0,5))===0;}))s+=60; });
    var best=i.pres[0];
    if(num[1]){ var v=parseFloat(num[1].replace(',','.')); var u=num[2]||''; var ml=/L|LT/.test(u)&&!/ML/.test(u)?v*1000:v;
      i.pres.forEach(function(p){ if(s>0&&Math.abs(p.f-ml)<1){best=p;s+=32;} }); }
    return {ins:i.id,pres:best.id,score:Math.min(96,s)};
  }).filter(function(x){return x.score>0;}).sort(function(a,b){return b.score-a.score;}).slice(0,3);
}

function adivinar(desc){var d=norm(desc), m, base='g', f=1000;
  if((m=d.match(/(\d+)\s*UN/))){base='u';f=+m[1];}
  else if((m=d.match(/(\d+[.,]?\d*)\s*(ML|CC)/))){base='ml';f=parseFloat(m[1].replace(',','.'));}
  else if((m=d.match(/(\d+[.,]?\d*)\s*(L|LT)\b/))){base='ml';f=parseFloat(m[1].replace(',','.'))*1000;}
  else if((m=d.match(/(\d+[.,]?\d*)\s*KG/))){f=parseFloat(m[1].replace(',','.'))*1000;}
  else if((m=d.match(/\b(\d{3,4})$/))){base='ml';f=+m[1];}
  else if(/ATADO|UNIDAD|X UN/.test(d)){base='u';f=1;}
  var nombre=desc.replace(/\s+(X\s)?\d.*$/i,'').replace(/\s+X\s.*$/i,'').toLowerCase().replace(/^./,function(c){return c.toUpperCase();});
  return {nombre:nombre,base:base,f:f};}

  produccion:S.cfg.mod.produccion?D.ordenes.filter(function(o){return o.loc===l.id&&o.estado==='abierta';}).length:0,
  fudo:S.cfg.mod.fudo&&l.fudo?D.fudoExc.filter(function(x){return x.loc===l.id;}).length+(D.ventas[l.id]?1:0):0}; }
function sideNav(){
  var b=badges(), cur=PARENT[S.view]||S.view;
  return NAV.map(function(n,ix){
    if(n[0][0]==='#'){ var any=false; for(var j=ix+1;j<NAV.length&&NAV[j][0][0]!=='#';j++){ if(!NAV[j][2]||S.cfg.mod[NAV[j][2]]) any=true; } return any?'<span class="eb">'+n[0].slice(1)+'</span>':''; }
    if(n[2]&&!S.cfg.mod[n[2]]) return '';
    var bd=b[n[0]]?'<span class="badge">'+b[n[0]]+'</span>':'';
    return '<button class="nl" data-go="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'>'+n[1]+bd+'</button>';
  }).join('');
}
function bottomNav(){
  var b=badges(), cur=PARENT[S.view]||S.view, items=[['inicio','Inicio'],['stock','Stock'],['compras','Compras'],[S.cfg.mod.costos?'costos':'proveedores',S.cfg.mod.costos?'Costos':'Proveed.'],['mas','Más']];
  var masViews=['resolver','proveedores','pancho','cuenta','cargar','produccion','fudo','catalogo'];
  return items.map(function(it){ var on = it[0]==='mas'? masViews.indexOf(cur)>=0&&it[0]!==cur : cur===it[0];
    if(it[0]==='compras'&&cur==='cargar')on=true;
    var dot=(it[0]==='compras'&&b.compras)||(it[0]==='mas'&&(b.resolver||b.produccion||b.fudo))?'<span class="dot"></span>':'';
    return '<button data-'+(it[0]==='mas'?'act="mas"':'go="'+it[0]+'"')+(on?' aria-current="page"':'')+'><i></i>'+it[1]+dot+'</button>'; }).join('');
}
function head(eb,title,right,backTo,backLabel){
  return (backTo?'<button class="back" data-go="'+backTo+'">← '+esc(backLabel)+'</button>':'')+
    '<div class="head"><div><span class="eb">'+eb+'</span><h1 class="h1">'+title+'</h1></div>'+(right||'')+'</div>';
}
function stPill(c){var e=etiqueta(c);return '<span class="st c-'+(e.k==='neu'?'x dim':e.k)+'">'+esc(e.t)+'</span>';}

        insCompra(cat).map(function(i){return i.pres.map(function(pp){var v=i.id+'|'+pp.id; return '<option value="'+v+'"'+(r.ins===i.id&&r.pres===pp.id?' selected':'')+'>'+esc(i.nombre+' · '+pp.n)+'</option>';}).join('');}).join('')+'</select>';
      right='<div class="line">'+(ins?'<span class="c-ok">●</span>':'<span class="dim">○</span>')+sel+(ins?'<span class="mono dim" style="font-size:12px">+'+qty(r.ins,r.cant*f)+'</span>':'')+'</div>'+
        (!ins&&opts[0]?'<div class="line" style="font-size:13px"><span class="dim">Sugerido:</span><button class="c-lime" data-act="usar-sug" data-ren="'+r.id+'" data-v="'+opts[0].ins+'|'+opts[0].pres+'">'+esc(D.ins[opts[0].ins].nombre+' · '+presDe(D,opts[0].ins,opts[0].pres).n)+' ('+opts[0].score+'%)</button></div>':'');
    } else {

        : (r.estado==='resolver'?'<div class="line" style="font-size:13px"><span class="c-warn">● Sin insumo</span><button class="c-lime" data-go="resolver" data-ren="'+r.id+'">Resolver</button></div>':'<span class="dim" style="font-size:13px">'+esc(r.estado==='ignorado'?'Ignorado':'')+'</span>');

    return '<div class="ren'+(dud?' dudoso':'')+'"><div class="between" style="flex-wrap:wrap"><span class="raw">'+esc(r.desc)+(r.alic?' <span style="color:var(--fg2)">· IVA '+nd(r.alic*100,1)+'% · '+money(r.cant*r.precio*r.alic)+'</span>':'')+'</span><div class="line">'+cantIn+preIn+'</div></div>'+
      (dud&&d?'<div class="between" style="flex-wrap:wrap;font-size:13px"><span class="c-warn">'+esc(d.msg)+'</span><button class="btn btn-s" data-act="ok-campo" data-ren="'+r.id+'">Está bien así</button></div>':'')+right+'</div>';
  }).join('');
  var checks = '<ul class="checks">'+
    '<li>'+(k.sumaOk?'<span class="c-ok">✓</span> Renglones = neto':'<span class="c-crit">✕</span> Renglones no cierran por '+money(Math.abs(k.diff)))+'</li>'+

      (sinIns?'<span class="dim" style="font-size:13px">'+sinIns+' '+(sinIns>1?'renglones sin insumo quedan':'renglón sin insumo queda')+' en «Para resolver» y no suman stock.</span>':'')+

    foot='<section class="stack" style="gap:10px"><span class="eb">Movimientos de stock generados</span><ul class="list card">'+movs.map(function(m){return '<li><button class="li" data-go="insumo" data-ins="'+m.ins+'"><span class="grow"><span class="t">'+esc(D.ins[m.ins].nombre)+'</span><span class="s">COMPRA · '+dm(m.fecha)+'</span></span><span class="mono c-ok">+'+qty(m.ins,m.cant)+'</span></button></li>';}).join('')+'</ul></section>';
  }
  return '<div class="wrap" style="max-width:920px">'+
    head(esc(c.tipo)+' · '+esc(c.num)+' · '+esc(l.corto), '<button data-go="proveedor" data-prov="'+c.prov+'" style="color:inherit">'+esc(p.corto)+'</button>',
      '<span class="pill '+(e.k==='neu'?'neu':e.k)+'">'+esc(e.t)+(editable?' · '+k.conf+'%':'')+'</span>', 'compras','Comprobantes')+
    '<div class="fields"><div><span class="eb">Fecha</span><span class="mono">'+dm(c.fecha)+'</span></div><div><span class="eb">Neto</span><span class="mono">'+n0(n)+'</span></div><div><span class="eb">IVA 21%</span><span class="mono">'+n0(ivaPor(c,0.21))+'</span></div><div><span class="eb">IVA 10,5%</span><span class="mono">'+n0(ivaPor(c,0.105))+'</span></div><div><span class="eb">Percepciones</span>'+(editable?'<input data-in="perc" data-comp="'+c.id+'" value="'+Math.round((c.percIva||0)+(c.percIibb||0))+'" inputmode="decimal" aria-label="Percepciones" style="height:30px;width:100%;font-family:var(--f-mono);font-size:13px">':'<span class="mono">'+n0((c.percIva||0)+(c.percIibb||0))+'</span>')+'</div><div><span class="eb">Total</span><span class="mono">'+n0(total(c))+'</span></div>'+

V.compras=function(){
  var l=L(), f=S.filtro, all=S.alcance==='todos';
  var base=D.comp.filter(function(c){return (all?catDe(D,c.loc)===l.cat:c.loc===l.id);});
  var cola=S.cola.filter(function(q){return all?catDe(D,q.loc)===l.cat:q.loc===l.id;});
